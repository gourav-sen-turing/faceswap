[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-quality-assessment"
version = "1.0.0"
description = "Enterprise Face Quality Assessment Microservice"
authors = [
    {name = "Face Quality Team", email = "team@facequality.ai"}
]
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
keywords = ["face", "quality", "assessment", "opencv", "dlib", "deep-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "opencv-python>=4.8.1",
    "dlib>=19.24.2",
    "torch>=2.1.1",
    "numpy>=1.24.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]

gpu = [
    "onnxruntime-gpu>=1.16.3",
]

[project.urls]
Homepage = "https://github.com/facequality/assessment"
Documentation = "https://docs.facequality.ai"
Repository = "https://github.com/facequality/assessment.git"
Issues = "https://github.com/facequality/assessment/issues"

[tool.setuptools]
packages = ["app", "app.core", "app.models", "app.services", "app.api"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
