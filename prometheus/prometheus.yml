global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'face-quality-monitor'

scrape_configs:
  - job_name: 'face-quality-api'
    static_configs:
      - targets: 
          - 'face-quality-api:8000'
          - 'face-quality-worker-1:8000'
          - 'face-quality-worker-2:8000'
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alerts.yml"
